version: '3.8'

services:
  app:
    image: node:18-alpine
    container_name: qc-live-production
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
      - ./data:/app/data
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    command: >
      sh -c "
        apk add --no-cache ffmpeg python3 py3-pip make g++ &&
        pip3 install --no-cache-dir --break-system-packages yt-dlp &&
        npm install --production &&
        npm rebuild sqlite3 &&
        npm run build &&
        npm start
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
